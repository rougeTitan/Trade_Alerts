# Trade Alerts - nginx site config
# Serves the exported Expo web app (static) and reverse-proxies /api -> gunicorn.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/trade-alerts.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (free): after this works on port 80, run certbot to auto-add 443:
#   sudo certbot --nginx -d your-domain.com

server {
    listen 80;
    server_name _;   # replace with your domain, or leave _ for IP-only

    # Static Expo web build (output of: npx expo export -p web)
    root /home/ec2-user/trade-alerts/web;
    index index.html;

    # API -> gunicorn
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA fallback: expo-router web uses client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
