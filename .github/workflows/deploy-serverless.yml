name: Deploy Serverless (Lambda schedules)

# Fully hands-off deploy of the scheduled checker AND the web dashboard.
# On every push to main it builds both Lambda images (checker + web), pushes to
# ECR, applies the Terraform in deploy/terraform-serverless, then builds the
# Expo web frontend against the Lambda Function URL and publishes it to
# S3 + CloudFront. After this runs once everything is automatic:
# EventBridge fires the checker on weekdays at 12:00 and 15:00 ET, and the
# dashboard is reachable at the CloudFront URL (terraform output dashboard_url).
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   AWS_ACCESS_KEY_ID       IAM access key with rights to create the stack
#   AWS_SECRET_ACCESS_KEY   matching secret
#   CONFIG_JSON             full contents of config.json (Gmail creds live here)
# Optional secrets / variables:
#   AWS_REGION  (repo variable or secret; defaults to us-east-1)
#   WATCHLIST_B64  base64 of watchlist.xlsx, so the bucket is seeded automatically
#                  (create with: certutil -encode / `base64 watchlist.xlsx`)

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - 'deploy/lambda/**'
      - 'deploy/lambda-web/**'
      - 'deploy/terraform-serverless/**'
      - 'mobile/**'
      - '.github/workflows/deploy-serverless.yml'
  workflow_dispatch:

concurrency:
  group: deploy-serverless
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'us-east-1' }}
  PROJECT: trade-alerts
  TF_DIR: deploy/terraform-serverless
  WL1: ${{ secrets.WATCHLIST_B64 }}
  WL2: ${{ secrets.WATCHLIST_B64_2 }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write config.json (Gmail creds)
        run: printf '%s' '${{ secrets.CONFIG_JSON }}' > config.json

      - name: Restore watchlist.xlsx (optional)
        if: ${{ env.WL1 != '' }}
        run: |
          {
            printf '%s' "$WL1"
            printf '%s' "$WL2"
          } | base64 -d > watchlist.xlsx
          ls -l watchlist.xlsx

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Ensure Terraform state bucket
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="${PROJECT}-tfstate-${ACCOUNT}"
          echo "TF_STATE_BUCKET=${BUCKET}" >> "$GITHUB_ENV"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$BUCKET"
            else
              aws s3api create-bucket --bucket "$BUCKET" \
                --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$BUCKET" \
              --versioning-configuration Status=Enabled
          fi

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}"

      - name: Create ECR repos (phase 1)
        working-directory: ${{ env.TF_DIR }}
        run: |
          # Adopt repos that already exist in AWS but aren't yet in state.
          terraform import -var "build_image=false" -var "region=${AWS_REGION}" \
            aws_ecr_repository.this "${PROJECT}-lambda" 2>/dev/null || true
          terraform import -var "build_image=false" -var "region=${AWS_REGION}" \
            aws_ecr_repository.web "${PROJECT}-web" 2>/dev/null || true

          terraform apply -input=false -auto-approve \
            -target=aws_ecr_repository.this \
            -target=aws_ecr_repository.web \
            -var "build_image=false" \
            -var "region=${AWS_REGION}"

      - name: Build & push Lambda images (checker + web)
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          TAG="${GITHUB_SHA::12}"
          echo "IMAGE_TAG=${TAG}" >> "$GITHUB_ENV"

          CHECKER="${REGISTRY}/${PROJECT}-lambda:${TAG}"
          docker build -f deploy/lambda/Dockerfile -t "$CHECKER" .
          docker push "$CHECKER"

          WEB="${REGISTRY}/${PROJECT}-web:${TAG}"
          docker build -f deploy/lambda-web/Dockerfile -t "$WEB" .
          docker push "$WEB"

      - name: Adopt pre-existing resources into state (idempotent)
        working-directory: ${{ env.TF_DIR }}
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          imp() {
            terraform import -input=false \
              -var "build_image=false" -var "region=${AWS_REGION}" \
              -var "image_tag_override=${IMAGE_TAG}" \
              -var "web_image_tag_override=${IMAGE_TAG}" \
              "$1" "$2" 2>/dev/null || true
          }
          # Only resources with deterministic names that error on re-create.
          imp aws_s3_bucket.state             "${PROJECT}-state-${ACCOUNT}"
          imp aws_s3_bucket.frontend          "${PROJECT}-web-${ACCOUNT}"
          imp aws_secretsmanager_secret.email "${PROJECT}/email"
          imp aws_iam_role.lambda             "${PROJECT}-lambda-role"
          imp aws_iam_role.scheduler          "${PROJECT}-scheduler-role"
          imp aws_cloudwatch_log_group.lambda "/aws/lambda/${PROJECT}-checker"
          imp aws_cloudwatch_log_group.web    "/aws/lambda/${PROJECT}-web"
          imp aws_lambda_function.checker     "${PROJECT}-checker"
          imp aws_lambda_function.web         "${PROJECT}-web"
          imp aws_scheduler_schedule.noon     "default/${PROJECT}-noon"
          imp aws_scheduler_schedule.afternoon "default/${PROJECT}-3pm"
          imp aws_lambda_function_url.web     "${PROJECT}-web"
          imp aws_lambda_permission.web_url   "${PROJECT}-web/AllowPublicFunctionUrl"

      - name: Recreate web Function URL cleanly
        working-directory: ${{ env.TF_DIR }}
        run: |
          # A Function URL can get stuck returning 403 even with auth NONE +
          # a valid public resource policy. Drop the URL + its permission so the
          # apply below provisions them fresh (new subdomain, clean auth state).
          aws lambda delete-function-url-config --function-name "${PROJECT}-web" 2>/dev/null || true
          terraform state rm aws_lambda_function_url.web 2>/dev/null || true
          terraform state rm aws_lambda_permission.web_url 2>/dev/null || true

      - name: Terraform apply (phase 2 - full stack)
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply -input=false -auto-approve \
            -var "build_image=false" \
            -var "image_tag_override=${IMAGE_TAG}" \
            -var "web_image_tag_override=${IMAGE_TAG}" \
            -var "region=${AWS_REGION}"

      - name: Ensure web Function URL is public (safety net)
        run: |
          set -euo pipefail
          # Force auth type NONE.
          aws lambda update-function-url-config \
            --function-name "${PROJECT}-web" \
            --auth-type NONE >/dev/null
          # Clean re-add of the public invoke permission (remove is best-effort).
          aws lambda remove-permission \
            --function-name "${PROJECT}-web" \
            --statement-id AllowPublicFunctionUrl 2>/dev/null || true
          aws lambda add-permission \
            --function-name "${PROJECT}-web" \
            --statement-id AllowPublicFunctionUrl \
            --action lambda:InvokeFunctionUrl \
            --principal "*" \
            --function-url-auth-type NONE
          echo "----- function url config -----"
          URL=$(aws lambda get-function-url-config --function-name "${PROJECT}-web" \
                  --query FunctionUrl --output text)
          echo "URL=$URL"
          echo "----- runner curl (expect 200) -----"
          sleep 5
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "${URL}api/watchlist" || echo "000")
          echo "GET /api/watchlist -> $CODE"

      - name: Capture Terraform outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform output
          echo "API_URL=$(terraform output -raw web_function_url | sed 's:/*$::')" >> "$GITHUB_ENV"
          echo "FRONTEND_BUCKET=$(terraform output -raw frontend_bucket)" >> "$GITHUB_ENV"
          echo "CF_ID=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Build web frontend (points at Function URL)
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ env.API_URL }}
        run: |
          npm ci
          npx expo export -p web

      - name: Publish frontend to S3 + invalidate CloudFront
        run: |
          aws s3 sync mobile/dist "s3://${FRONTEND_BUCKET}" --delete
          aws cloudfront create-invalidation --distribution-id "$CF_ID" --paths "/*"
          echo "Dashboard: https://$(aws cloudfront get-distribution --id "$CF_ID" --query 'Distribution.DomainName' --output text)"
